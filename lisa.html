<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>I Love You Putri Nurlisa Binti Hamdan | Forever</title>
    <!-- Google Fonts untuk tipografi yang elegan -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #1a1f2f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* Partikel bintang berkilau latar belakang */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite ease-in-out;
            box-shadow: 0 0 6px rgba(255,255,200,0.8);
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.8);}
            50% { opacity: 0.9; transform: scale(1.2);}
            100% { opacity: 0; transform: scale(0.8);}
        }

        /* Hiasan floating hearts */
        .floating-heart {
            position: fixed;
            font-size: 1.4rem;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
            animation: floatUp 8s linear forwards;
            color: #ff5e7e;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Container utama - efek kaca mewah */
        .love-card {
            position: relative;
            z-index: 10;
            max-width: 880px;
            width: 100%;
            background: rgba(20, 25, 40, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 215, 200, 0.25);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 200, 180, 0.1) inset;
            padding: 2rem 2rem 3rem;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Hiasan sinar lembut di sekeliling */
        .love-card::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: radial-gradient(circle at 30% 20%, rgba(255,120,150,0.2), transparent 70%);
            border-radius: 3rem;
            z-index: -1;
            pointer-events: none;
        }

        /* Ikon hati besar berdenyut */
        .heart-icon {
            font-size: 5rem;
            color: #ff4d6d;
            filter: drop-shadow(0 0 12px rgba(255, 77, 109, 0.6));
            animation: pulseHeart 1.5s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); text-shadow: 0 0 0 rgba(255,77,109,0);}
            50% { transform: scale(1.2); text-shadow: 0 0 20px #ff4d6d;}
            100% { transform: scale(1); text-shadow: 0 0 0 rgba(255,77,109,0);}
        }

        /* Teks utama dengan efek gradien */
        .main-text {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 10vw, 4.2rem);
            background: linear-gradient(135deg, #FFDEE9 0%, #FFB5C0 40%, #FF6A88 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.8rem;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            animation: gentleGlow 3s infinite alternate;
        }

        @keyframes gentleGlow {
            0% { filter: brightness(1);}
            100% { filter: brightness(1.1); text-shadow: 0 0 5px rgba(255,105,135,0.4);}
        }

        /* Nama lengkap dengan efek khusus */
        .name-special {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: clamp(1.4rem, 7vw, 2.2rem);
            background: linear-gradient(120deg, #fbc2c2, #ff9a9e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-top: 0.5rem;
            margin-bottom: 1.8rem;
            letter-spacing: 1px;
            word-break: keep-all;
        }

        /* sub-text dengan hiasan */
        .sub-message {
            color: rgba(255, 245, 240, 0.9);
            font-weight: 400;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            margin-bottom: 2rem;
            border: 1px solid rgba(255,200,180,0.3);
        }

        /* galeri animasi kalimat cinta */
        .loving-quote {
            font-size: 1rem;
            color: #ffcfd4;
            margin: 1.5rem 0;
            font-style: italic;
            font-weight: 300;
            transition: all 0.4s;
            background: rgba(0,0,0,0.2);
            border-radius: 2rem;
            padding: 0.7rem 1rem;
            display: inline-block;
        }

        /* butang interaktif */
        .btn-love {
            background: linear-gradient(45deg, #ff6a7c, #ff3b5c);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 14px rgba(255, 59, 92, 0.4);
            backdrop-filter: blur(5px);
        }

        .btn-love:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #ff8a98, #ff1e44);
            box-shadow: 0 10px 20px rgba(255, 59, 92, 0.5);
        }

        .btn-love:active {
            transform: scale(0.98);
        }

        /* galeri kata kata */
        .love-notes {
            margin: 2rem 0 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
        }

        .note-chip {
            background: rgba(255, 255, 255, 0.12);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ffe0e4;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            border: 1px solid rgba(255,150,150,0.3);
            animation: fadeSlideUp 0.6s ease backwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(15px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* footer murni */
        .footer-small {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: rgba(255,210,200,0.6);
            letter-spacing: 0.5px;
        }

        /* efek responsif */
        @media (max-width: 550px) {
            .love-card {
                padding: 1.5rem;
            }
            .btn-love {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .note-chip {
                font-size: 0.75rem;
                padding: 0.3rem 1rem;
            }
        }
    </style>
</head>
<body>

<div class="stars" id="starsContainer"></div>

<div class="love-card">
    <div class="heart-icon">
        <i class="fas fa-heart"></i>
    </div>
    <div class="main-text">
        I LOVE YOU
    </div>
    <div class="name-special">
        PUTRI NURLISA BINTI HAMDAN
    </div>
    <div class="sub-message">
        <i class="fas fa-infinity"></i>  dengan segenap hati & jiwa  <i class="fas fa-feather-alt"></i>
    </div>

    <!-- Petikan romantis beranimasi -->
    <div class="loving-quote" id="dynamicQuote">
        <i class="fas fa-quote-left" style="margin-right: 6px;"></i> 
        Setiap degup jantungku berbisik namamu.
        <i class="fas fa-quote-right" style="margin-left: 6px;"></i>
    </div>

    <!-- butang untuk ubah quote -->
    <button class="btn-love" id="changeQuoteBtn">
        <i class="fas fa-heartbeat"></i>  Pesan Rindu Lainnya
    </button>

    <!-- koleksi kata manis -->
    <div class="love-notes">
        <span class="note-chip"><i class="fas fa-star"></i>  Cinta pertama & terakhir</span>
        <span class="note-chip"><i class="fas fa-gem"></i>  Untukmu, Putri</span>
        <span class="note-chip"><i class="fas fa-moon"></i>  Terangi hariku</span>
        <span class="note-chip"><i class="fas fa-cloud-moon"></i>  selamanya</span>
    </div>

    <div class="footer-small">
        <i class="fas fa-heart" style="color: #ff6a7c;"></i>  Untukmu yang tiada duanya  <i class="fas fa-heart" style="color: #ff6a7c;"></i>
    </div>
</div>

<script>
    // 1. Fungsi mencipta bintang latar (cantik dan tenang)
    function createStars() {
        const starsContainer = document.getElementById('starsContainer');
        const starCount = 180;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1; // 1px hingga 4px
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            const duration = Math.random() * 3 + 2; // 2-5s
            star.style.animationDuration = `${duration}s`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }
    }

    // 2. Floating hearts dinamik - banyak hati kecil terapung
    function createFloatingHeart() {
        const heart = document.createElement('div');
        heart.classList.add('floating-heart');
        heart.innerHTML = '<i class="fas fa-heart"></i>';
        const size = Math.random() * 20 + 14; // 14px hingga 34px
        heart.style.fontSize = `${size}px`;
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.opacity = Math.random() * 0.6 + 0.2;
        const duration = Math.random() * 6 + 5; // 5 - 11 detik
        heart.style.animationDuration = `${duration}s`;
        heart.style.animationDelay = `${Math.random() * 2}s`;
        document.body.appendChild(heart);
        
        // remove after animation end
        heart.addEventListener('animationend', () => {
            heart.remove();
        });
    }

    // 3. Koleksi quotes romantis untuk ditukar (dalam bahasa melayu & inggeris roh cinta)
    const quotesList = [
        { text: "Setiap degup jantungku berbisik namamu.", icon: "fas fa-heart" },
        { text: "Putri Nurlisa, engkau adalah puisi yang tak pernah usang.", icon: "fas fa-feather" },
        { text: "Bersamamu, setiap hari terasa seperti mimpi indah.", icon: "fas fa-cloud-sun" },
        { text: "Cintaku padamu seluas lautan dan setinggi bintang.", icon: "fas fa-water" },
        { text: "Dunia lebih bermakna kerana senyumanmu, Putri.", icon: "fas fa-smile-wink" },
        { text: "Kau adalah alasan aku percaya pada cinta abadi.", icon: "fas fa-infinity" },
        { text: "Cahaya mataharimu menerangi setiap sudut jiwaku.", icon: "fas fa-sun" },
        { text: "Untuk PUTRI NURLISA BINTI HAMDAN: Aku mencintaimu lebih dari kata-kata.", icon: "fas fa-book-open" }
    ];
    
    let currentQuoteIndex = 0;
    const dynamicQuoteDiv = document.getElementById('dynamicQuote');
    const changeQuoteBtn = document.getElementById('changeQuoteBtn');
    
    function updateQuote(index) {
        const quoteData = quotesList[index % quotesList.length];
        dynamicQuoteDiv.innerHTML = `<i class="${quoteData.icon}" style="margin-right: 6px;"></i> ${quoteData.text} <i class="fas fa-quote-right" style="margin-left: 6px;"></i>`;
        // tambah little bounce effect
        dynamicQuoteDiv.style.transform = "scale(1.02)";
        setTimeout(() => { dynamicQuoteDiv.style.transform = "scale(1)"; }, 200);
    }
    
    changeQuoteBtn.addEventListener('click', () => {
        currentQuoteIndex = (currentQuoteIndex + 1) % quotesList.length;
        updateQuote(currentQuoteIndex);
    });
    
    // 4. Terus menerus menghasilkan floating hearts (cantik melayang)
    let heartInterval;
    function startHeartRain() {
        heartInterval = setInterval(() => {
            createFloatingHeart();
        }, 800);
    }
    
    // 5. Tambahan: animasi particle confetti ringan ketika halaman dimuat (tanda ceria)
    function initialCelebration() {
        // Buat 15 floating hearts pantas pada awal
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                createFloatingHeart();
            }, i * 100);
        }
    }
    
    // 6. Tambah effect cinta tambahan - kursor hati? tapi jangan terlalu berat, tapi kita akan buat kesan cahaya mengikut pergerakan tetikus (bonus romantik)
    document.body.addEventListener('mousemove', (e) => {
        // Buat sparkle kecil sesekali - sangat minimal tapi wow
        if (Math.random() > 0.97) {
            const spark = document.createElement('div');
            spark.style.position = 'fixed';
            spark.style.left = `${e.clientX}px`;
            spark.style.top = `${e.clientY}px`;
            spark.style.width = '6px';
            spark.style.height = '6px';
            spark.style.background = 'radial-gradient(circle, #ff99aa, #ff4d6d)';
            spark.style.borderRadius = '50%';
            spark.style.pointerEvents = 'none';
            spark.style.zIndex = '9999';
            spark.style.opacity = '0.7';
            spark.style.filter = 'blur(1px)';
            document.body.appendChild(spark);
            setTimeout(() => { spark.remove(); }, 400);
        }
    });
    
    // 7. animasi denyutan pada kad untuk lebih 'hidup'
    const card = document.querySelector('.love-card');
    setInterval(() => {
        card.style.transform = "scale(1.002)";
        setTimeout(() => { card.style.transform = "scale(1)"; }, 150);
    }, 3000);
    
    // 8. Semua initialization
    window.addEventListener('load', () => {
        createStars();          // bintang statik berkelip
        startHeartRain();      // hati terapung berterusan
        initialCelebration();  // sambutan awal hati gembira
        
        // Memastikan setiap 30 saat, tukar quote secara automatik jika pengguna tidak klik (optional)
        setInterval(() => {
            currentQuoteIndex = (currentQuoteIndex + 1) % quotesList.length;
            updateQuote(currentQuoteIndex);
        }, 12000);
        
        // tambah kesan kemasukan elemen note-chip dengan staggered delay
        const chips = document.querySelectorAll('.note-chip');
        chips.forEach((chip, idx) => {
            chip.style.animationDelay = `${idx * 0.1 + 0.1}s`;
        });
        
        // Menampilkan mesej cinta utama dengan kesan taip perlahan? tidak diperlukan kerana sudah jelas. 
        // namun kita boleh tambah kesan glitter pada nama utama
        const nameSpan = document.querySelector('.name-special');
        if (nameSpan) {
            setInterval(() => {
                nameSpan.style.textShadow = "0 0 8px rgba(255,105,135,0.6)";
                setTimeout(() => { nameSpan.style.textShadow = "none"; }, 500);
            }, 4000);
        }
    });
    
    // tambah responsif untuk membersihkan interval ketika page unload (practically not needed tapi good)
    window.addEventListener('beforeunload', () => {
        if (heartInterval) clearInterval(heartInterval);
    });
    
    // 9. khas: memastikan nama penuh tidak terpotong dan sentiasa lengkap (tambahan Hiasan)
    // final: juga minta maaf jika sesetengah mobile prestasi tetap ok
    // Create additional hearts on click di card? tapi optional
    card.addEventListener('click', (e) => {
        // jika klik card terbitkan 3 hati di sekitar klik
        for (let i=0; i<5; i++) {
            setTimeout(() => createFloatingHeart(), i*50);
        }
        // efek getar butang asyik
        const btn = document.getElementById('changeQuoteBtn');
        btn.style.transform = "scale(0.98)";
        setTimeout(() => { btn.style.transform = "scale(1)"; }, 150);
    });
    
    // 10. tambahan background animasi gradien halus pada body (biar lebih dramatik)
    let hue = 0;
    setInterval(() => {
        // hanya perubahan sangat perlahan warna background tidak mengganggu teks
        // tapi kita ada gradient tetap. jom buat subtle change pada pseudo element
        document.body.style.background = `linear-gradient(135deg, #0a0f1e 0%, #191e2f 100%)`;
        // sebenarnya nak beri feel lembut tidak perlu ubah banyak, cuma pastikan kekal romantis.
    }, 10000);
</script>
</body>
</html>
